services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${GUIDE_HOST_PORT:-8035}:80"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    expose:
      - '80'
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost/ || curl -fsS http://localhost/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
