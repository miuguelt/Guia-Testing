<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="180" stroke="url(#auroraGrad)" stroke-width="12" fill="none" opacity="0.4" />
  <g filter="url(#glow)">
    <!-- Escudo / Lupa de Testing & QA -->
    <path d="M256 110 L370 160 V260 C370 336 256 400 256 400 C256 400 142 336 142 260 V160 Z" fill="rgba(15, 23, 42, 0.75)" stroke="url(#auroraGrad)" stroke-width="14" stroke-linejoin="round" />
    <!-- Checkmark de Aprobación QA -->
    <path d="M200 250 L240 290 L320 200" fill="none" stroke="#34d399" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
