name: CI - Testing Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Go to practice project
        working-directory: recursos/codigo-ejemplo
        run: pwd
      - name: Install dependencies
        working-directory: recursos/codigo-ejemplo
        run: |
          python -m pip install -r requirements.txt
      - name: Run tests with coverage
        working-directory: recursos/codigo-ejemplo
        run: python -m pytest --cov=services --cov=routers --cov=schemas --cov-fail-under=80 --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4

  react-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: recursos/codigo-ejemplo/package-lock.json
      - name: Install JavaScript dependencies
        working-directory: recursos/codigo-ejemplo
        run: npm ci
      - name: Run component tests
        working-directory: recursos/codigo-ejemplo
        run: npm test
      - name: Run component coverage
        working-directory: recursos/codigo-ejemplo
        run: npm run test:coverage

  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run JUnit and JaCoCo
        working-directory: recursos/codigo-ejemplo
        run: mvn --batch-mode test jacoco:report

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [python-tests, react-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: recursos/codigo-ejemplo/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: recursos/codigo-ejemplo
        run: |
          python -m pip install Flask
          npm ci
      - name: Install Chromium
        working-directory: recursos/codigo-ejemplo
        run: npx playwright install --with-deps chromium
      - name: Run Flask E2E suite
        working-directory: recursos/codigo-ejemplo
        run: FLASK_SECRET_KEY="$(openssl rand -hex 32)" npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: recursos/codigo-ejemplo/playwright-report/
