{% extends "base.html" %}

{% block title %}Productos | Inventario{% endblock %}

{% block content %}
  <h1>Productos</h1>

  <form method="post" aria-label="Crear producto">
    <label for="nombre">Nombre</label>
    <input id="nombre" name="nombre" required>

    <label for="precio">Precio</label>
    <input id="precio" name="precio" type="number" step="0.01" required>

    <button type="submit">Guardar producto</button>
  </form>

  <section aria-label="Lista de productos" data-testid="lista-productos">
    {% if products %}
      <ul>
        {% for product in products %}
          <li data-testid="producto-row">
            <span>{{ product.nombre }}</span>
            <span>{{ product.precio }}</span>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No hay productos.</p>
    {% endif %}
  </section>
{% endblock %}
