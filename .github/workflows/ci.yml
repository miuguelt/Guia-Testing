name: CI - Monorepo QA multi-lenguaje

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guide-tests:
    name: Guía web y contratos del repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: recursos/codigo-ejemplo/requirements.txt
      - name: Instalar dependencias de la guía
        run: python -m pip install -r recursos/codigo-ejemplo/requirements.txt
      - name: Ejecutar pruebas de la guía y del paquete publicado
        run: python -m pytest -q

  python-tests:
    name: Python · PyTest + Behave
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recursos/codigo-ejemplo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: recursos/codigo-ejemplo/requirements.txt
      - name: Instalar dependencias Python
        run: python -m pip install -r requirements.txt
      - name: Ejecutar PyTest con cobertura
        run: python -m pytest tests --cov=services --cov=routers --cov=schemas --cov-fail-under=80 --cov-report=xml --cov-report=term-missing
      - name: Ejecutar escenarios BDD
        run: python -m behave -q
      - name: Guardar cobertura Python
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-python-coverage
          path: recursos/codigo-ejemplo/coverage.xml
          if-no-files-found: ignore

  javascript-tests:
    name: JavaScript · Vitest + React Testing Library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recursos/codigo-ejemplo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: recursos/codigo-ejemplo/package-lock.json
      - name: Instalar dependencias JavaScript
        run: npm ci
      - name: Ejecutar pruebas y compuerta de cobertura
        run: npm run test:coverage
      - name: Guardar cobertura JavaScript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-javascript-coverage
          path: recursos/codigo-ejemplo/coverage/
          if-no-files-found: ignore

  java-tests:
    name: Java · JUnit 5 + JaCoCo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recursos/codigo-ejemplo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: recursos/codigo-ejemplo/pom.xml
      - name: Ejecutar pruebas Java y generar cobertura
        run: mvn --batch-mode test jacoco:report
      - name: Guardar reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-java-jacoco
          path: recursos/codigo-ejemplo/target/site/jacoco/
          if-no-files-found: ignore

  e2e-tests:
    name: E2E · Playwright + Flask/Jinja
    runs-on: ubuntu-latest
    needs: [python-tests, javascript-tests]
    defaults:
      run:
        working-directory: recursos/codigo-ejemplo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: recursos/codigo-ejemplo/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recursos/codigo-ejemplo/requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Ejecutar pruebas E2E
        run: |
          export FLASK_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          npm run e2e
      - name: Guardar evidencia E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-playwright-evidence
          path: |
            recursos/codigo-ejemplo/playwright-report/
            recursos/codigo-ejemplo/test-results/
          if-no-files-found: ignore

  quality-gate:
    name: Quality Gate · monorepo en verde
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [guide-tests, python-tests, javascript-tests, java-tests, e2e-tests]
    steps:
      - name: Bloquear si alguna suite falló o fue omitida
        if: ${{ needs.guide-tests.result != 'success' || needs.python-tests.result != 'success' || needs.javascript-tests.result != 'success' || needs.java-tests.result != 'success' || needs.e2e-tests.result != 'success' }}
        run: |
          echo "El Quality Gate no se puede aprobar: una o más suites no terminaron correctamente."
          exit 1
      - name: Aprobar integración
        run: echo "Quality Gate aprobado - guía, Python, JavaScript, Java y E2E están en verde."
